<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil de invocador — La Bitácora del Amazonas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=16">
</head>
<body id="body-perfil">

<div class="volver-top"><a href="index.html">← Volver a la crónica</a></div>

<header class="perfil-header">
  <div class="perfil-header-avatar" id="perfil-avatar"></div>
  <div class="perfil-header-texto">
    <h1 id="perfil-nombre">Perfil de invocador</h1>
    <p id="perfil-subtitulo" class="perfil-header-sub" hidden></p>
  </div>
</header>

<main>
  <section id="perfil-contenido" class="seccion" hidden>
    <div class="seccion">
      <h2 class="titulo-seccion">📊 Estadísticas</h2>
      <div id="perfil-stats" class="fama-resumen"></div>
    </div>

    <div class="seccion">
      <h2 class="titulo-seccion">🏆 Premios ganados</h2>
      <div id="perfil-premios" class="premios-grid"></div>
    </div>

    <div class="seccion">
      <h2 class="titulo-seccion">🥇 Campeones más jugados</h2>
      <div id="perfil-campeones" class="perfil-campeones"></div>
      <button type="button" id="btn-ver-mas-campeones" class="ver-mas" hidden></button>
    </div>

    <div class="seccion">
      <h2 class="titulo-seccion">📜 Últimas partidas</h2>
      <div id="perfil-partidas" class="partidas-mini"></div>
    </div>
  </section>

  <div id="perfil-vacio" class="vacio-timeline" hidden></div>
</main>

<footer>
  <p>Escrito y reescrito por la banda. Cada partida es una página más.</p>
</footer>

<script src="js/comunes.js?v=5"></script>
<script src="js/jugador.js?v=5"></script>
</body>
</html>
